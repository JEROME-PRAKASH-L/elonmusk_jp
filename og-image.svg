<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Jerome Prakash L — J.A.R.V.I.S. Developer Portfolio</title>
  <desc id="desc">Arc Reactor developer interface for Jerome Prakash L, focused on AI agents, full-stack engineering, automation, data analytics, and computer vision.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020509"/>
      <stop offset="0.58" stop-color="#061018"/>
      <stop offset="1" stop-color="#190407"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a41d23"/>
      <stop offset="0.32" stop-color="#f6c453"/>
      <stop offset="0.68" stop-color="#2be7ff"/>
      <stop offset="1" stop-color="#00a8c6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#173846" stroke-width="1" opacity=".28"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#base)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <image href="assets/profile-banner.svg" xlink:href="assets/profile-banner.svg" x="0" y="0" width="1200" height="420" preserveAspectRatio="xMidYMid meet"/>
  <rect x="0" y="417" width="1200" height="5" fill="url(#energy)"/>

  <g font-family="'JetBrains Mono',Consolas,monospace">
    <text x="64" y="474" fill="#f6c453" font-size="15" font-weight="700" letter-spacing="5">J.A.R.V.I.S. // PORTFOLIO ONLINE</text>
    <text x="64" y="532" fill="#effcff" font-size="45" font-weight="700" letter-spacing="2">JEROME PRAKASH L</text>
    <text x="65" y="570" fill="#77eefa" font-size="16" font-weight="700" letter-spacing="2">AI AGENTS  ·  FULL-STACK  ·  AUTOMATION  ·  DATA  ·  COMPUTER VISION</text>
    <text x="65" y="608" fill="#91b0ba" font-size="13" letter-spacing="2">jerome-prakash-l.github.io/elonmusk_jp/</text>

    <g transform="translate(970 505)" filter="url(#glow)">
      <path d="M0-54L47-27V27L0 54L-47 27V-27Z" fill="#031018" stroke="#2be7ff" stroke-width="4"/>
      <circle r="35" fill="none" stroke="#f6c453" stroke-width="3" stroke-dasharray="10 7"/>
      <circle r="25" fill="none" stroke="#8cf6ff" stroke-width="2"/>
      <text x="0" y="8" fill="#fff" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="2">JPL</text>
    </g>
    <g transform="translate(1055 454)">
      <text fill="#91b0ba" font-size="10" letter-spacing="1.5">ARC CORE</text>
      <text y="20" fill="#f6c453" font-size="12" font-weight="700" letter-spacing="1.5">100% POWER</text>
      <text y="72" fill="#91b0ba" font-size="10" letter-spacing="1.5">MISSION</text>
      <text y="92" fill="#2be7ff" font-size="12" font-weight="700" letter-spacing="1.5">COLLABORATE</text>
    </g>
  </g>
</svg>
